general {
    lock_cmd = pidof hyprlock || hyprlock   # lock if not already locked
    before_sleep_cmd = hyprlock             # lock before suspend
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'  # wake display after suspend
    on_unlock_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'    # wake display after unlocking
}

listener {
    timeout = 300                           # 5 min: lock screen
    on-timeout = hyprlock
}

listener {
    timeout = 360                           # 6 min: turn off display
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

listener {
    timeout = 1800                          # 30 min: suspend
    on-timeout = systemctl suspend
}
